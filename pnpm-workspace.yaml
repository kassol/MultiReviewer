packages:
  - "web"

# Pi 的传递依赖,其 build script 与本项目无关,不执行。esbuild 是 Vite 的构建后端,
# 它的 install script 负责校验平台二进制,放行。
allowBuilds:
  "@google/genai": false
  esbuild: true
  protobufjs: false

# pnpm 11 默认拒装发布不满 24 小时的版本(minimumReleaseAge),镜像里的
# `pnpm install --frozen-lockfile` 也按锁文件逐项核验。Pi 0.85.0 与 pi-subagents 0.65.1
# 都发布于 2026-09-04,升级当天不豁免就装不进镜像(issue #262)。豁免只钉这几个精确版本,
# 过了窗口它们自然失效,留着不影响之后的升级。
minimumReleaseAgeExclude:
  - "@earendil-works/chord@0.85.0"
  - "@earendil-works/pi-agent-core@0.85.0"
  - "@earendil-works/pi-ai@0.85.0"
  - "@earendil-works/pi-client@0.85.0"
  - "@earendil-works/pi-coding-agent@0.85.0"
  - "@earendil-works/pi-protocol@0.85.0"
  - "@earendil-works/pi-server@0.85.0"
  - "@earendil-works/pi-telemetry@0.85.0"
  - "@earendil-works/pi-tui@0.85.0"
  - "pi-subagents@0.65.1"
