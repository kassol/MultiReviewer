packages:
  - "web"

# Pi 的传递依赖,其 build script 与本项目无关,不执行。esbuild 是 Vite 的构建后端,
# 它的 install script 负责校验平台二进制,放行。
allowBuilds:
  "@google/genai": false
  esbuild: true
  protobufjs: false

# pi-subagents 0.82.1 发布于 2026-10-25T06:30Z,此次升级仍在 24 小时窗口内。
# 镜像的 pnpm 11 按锁文件核验;豁免钉精确版本,下次升级删除。
minimumReleaseAgeExclude:
  - "pi-subagents@0.82.1"
