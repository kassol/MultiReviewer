packages:
  - "web"

# Pi 的传递依赖,其 build script 与本项目无关,不执行。esbuild 是 Vite 的构建后端,
# 它的 install script 负责校验平台二进制,放行。
allowBuilds:
  "@google/genai": false
  esbuild: true
  protobufjs: false

# pnpm 11 默认拒装发布不满 24 小时的版本(minimumReleaseAge),镜像里的
# `pnpm install --frozen-lockfile` 也按锁文件逐项核验。pi-subagents 0.79.2 发布于
# 2026-10-20T06:12Z,升级当天不豁免就装不进镜像(调研见 docs/research/pi-subagents-0.79-2026-10-20.md)。
# Pi 1.3.0 升级时已过窗口,不在清单里。豁免只钉精确版本,下一次升级删掉。
minimumReleaseAgeExclude:
  - "pi-subagents@0.79.2"
