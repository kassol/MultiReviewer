# 服务器上只需要这个文件与 `.env` 两样,不需要源码。两样都由 scripts/setup.sh 在服务器上
# 生成或引导填写。模型组合与批次上限在库里,由面板的设置页管。
#
# 镜像在本地构建后推到 registry,更新走 `docker compose pull && docker compose up -d`。

services:
  multireviewer:
    image: ${MULTIREVIEWER_IMAGE:?请在 .env 里设置 MULTIREVIEWER_IMAGE}
    restart: unless-stopped

    # 以启动这套部署的那个宿主机用户身份运行,`./data` 因此天然可写,不需要 chown。
    # 部署目录放在 home 下时尤其重要:把目录改成别的属主会让你自己写不进自己的 home。
    # 实测容器在没有 passwd 条目的 uid 下照常工作(HOME 落到 /,无人写它)。
    user: "${MULTIREVIEWER_UID:-1000}:${MULTIREVIEWER_GID:-1000}"

    # 凭据与配置全部经环境变量进入容器。这个文件不含任何凭据值。
    env_file: .env

    # 换容器时先发 SIGTERM,服务进入排空:不再接新投递,在跑的轮次跑完当前批次并落库
    # 后退出(issue #249)。这个宽限期与应用的默认排空上限
    # `MULTIREVIEWER_DRAIN_TIMEOUT_SECONDS`(300 秒)是同一个数,改一处必须改另一处
    # ——宽限期更短的话,进程会在等批次的途中被 SIGKILL,那一批白跑。
    stop_grace_period: 300s

    # 容器内固定监听 3000。对外端口另用一个变量,与应用读的 MULTIREVIEWER_PORT 分开
    # ——同名会让应用改成监听宿主端口号,映射当场对不上。
    ports:
      - "${MULTIREVIEWER_HOST_PORT:-3000}:3000"

    volumes:
      # SQLite 与工作副本缓存。工作副本是每个仓库一份完整 clone,磁盘占用看仓库大小。
      # 路径相对于本文件所在目录,部署目录放哪里都行。
      - ./data:/data
