<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover:不写它,iOS 上 env(safe-area-inset-*) 恒为 0,底部 Tab 栏的
      安全区留白等于没写,栏目被 Home 指示条压住。写了之后页面铺满整块屏,让位改由
      styles.css 的 --v8-bottom-chrome 统一管。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 面板只做亮色一套。不声明的话系统切暗色时浏览器会把滚动条与表单控件画成暗色。 -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f5f6f8" />
    <!-- 面板不该进任何索引。 -->
    <meta name="robots" content="noindex, nofollow" />
    <!--
      安装到手机主屏:manifest 与四个图标是 dist 根下的固定名字(public/ 原样复制过去),
      由服务的白名单路由给,见 src/AGENTS.md。它们不能进 `/assets`——那里的长缓存靠
      文件名带内容哈希,而 manifest 里写死的是路径。
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      iOS 读 manifest 之前靠这两行:capable 去掉地址栏,status-bar 选 default 让状态栏
      占自己那一条——面板是亮色,black-translucent 会给白字压在白底上。
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Reviewer" />
    <!--
      图标内联成 data URI:省一次请求,dev 与生产同一份。三条错位短线 = 三个模型看同一段
      改动,与 web/src/components/mark.tsx 同一份图形(public/ 下那四个 PNG 也由它来)。
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d1d1f'/%3E%3Cg fill='%23fff'%3E%3Crect x='7' y='9' width='18' height='3' rx='1'/%3E%3Crect x='7' y='14.5' width='12' height='3' rx='1'/%3E%3Crect x='7' y='20' width='15' height='3' rx='1'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>MultiReviewer</title>
  </head>
  <!-- 字号走令牌里的 lg(13.5px):这套设计的正文档位,列表行主标题与它同档。 -->
  <body class="bg-background text-foreground font-sans text-lg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
