<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 面板只做亮色一套。不声明的话系统切暗色时浏览器会把滚动条与表单控件画成暗色。 -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f5f6f8" />
    <!-- 面板挂在随机前缀下,不该进任何索引。 -->
    <meta name="robots" content="noindex, nofollow" />
    <!--
      图标内联成 data URI:静态路由只对外开 /assets/*,放 public/ 的文件在生产会 404,
      而内联的与前缀无关,dev 与生产同一份。三条错位短线 = 三个模型看同一段改动。
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d1d1f'/%3E%3Cg fill='%23fff'%3E%3Crect x='7' y='9' width='18' height='3' rx='1'/%3E%3Crect x='7' y='14.5' width='12' height='3' rx='1'/%3E%3Crect x='7' y='20' width='15' height='3' rx='1'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>MultiReviewer</title>
  </head>
  <!-- 字号走令牌里的 lg(13.5px):这套设计的正文档位,列表行主标题与它同档。 -->
  <body class="bg-background text-foreground font-sans text-lg antialiased">
    <!--
      THESIS: 一眼看清当前能不能顺利完成审查、哪里要处理、处理动作在哪。
      OWN-WORLD: 冷灰底上浮白卡。顶栏是毛玻璃。主操作是 Apple 蓝。失败红、通过绿、注意琥珀。系统无衬线,字重靠 590 与 650 分层。控件圆角 9px,卡片 12px。
      STORY: 顶栏认路,总览看势,进列表定位到具体一行,沿同一行读原因并执行下一步。
      FIRST VIEWPORT: 双层顶栏——品牌与 ⌘K 在上,underline 导航在下,当前项带蓝色圆头短条。正文落在 1240px 内容轨上,卡片浮在灰底。窄屏收起导航层,换底部毛玻璃 Tab 栏。
      FORM: 毛玻璃控制台 · GitHub 的信息架构 × Apple 的材质
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
